[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wetlab-asset-preparation"
version = "0.1.0"
description = "Protocol-grounded asset requirements and reference retrieval"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7", "defusedxml>=0.7.1,<0.8", "fonttools==4.66.1"]

[project.optional-dependencies]
generation = ["mujoco==3.3.7", "Pillow==11.3.0", "trimesh==4.7.4"]

[tool.setuptools.packages.find]
where = ["src"]
